version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adunni
      POSTGRES_USER: adunni
      POSTGRES_PASSWORD: adunni_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/session-store/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./packages/security/sql/security_migration.sql:/docker-entrypoint-initdb.d/02-security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adunni"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://adunni:adunni_dev_pass@postgres:5432/adunni
      - ASR_SERVICE_URL=http://asr-service:3001
      - TTS_SERVICE_URL=http://tts-service:3002
      - ORCHESTRATOR_URL=http://orchestrator:3003
      - ACTION_EXECUTOR_URL=http://action-executor:3004
      - CONFIG_SERVICE_URL=http://config-service:3005
      - SESSION_STORE_URL=http://session-store:3006
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - ENCRYPTION_KEY=dev_encryption_key_change_in_production
      - TLS_CERT_PATH=${TLS_CERT_PATH:-}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TAVUS_API_KEY=${TAVUS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  asr-service:
    build:
      context: .
      dockerfile: packages/asr-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - SUPPORTED_LANGUAGES=en-NG,pcm,yo,ig,ha
      - ASR_ENGINE_URL=http://asr-engine:3010
    depends_on:
      redis:
        condition: service_healthy
      asr-engine:
        condition: service_healthy
    restart: unless-stopped

  asr-engine:
    build:
      context: .
      dockerfile: packages/asr-engine/Dockerfile
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - asr-models:/models
    restart: unless-stopped

  tts-service:
    build:
      context: .
      dockerfile: packages/tts-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: packages/orchestrator/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - ACTION_EXECUTOR_URL=http://action-executor:3004
      - LLM_PROVIDER=anthropic
      - LLM_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=claude-sonnet-4-20250514
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  action-executor:
    build:
      context: .
      dockerfile: packages/action-executor/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://adunni:adunni_dev_pass@postgres:5432/adunni
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  config-service:
    build:
      context: .
      dockerfile: packages/config-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://adunni:adunni_dev_pass@postgres:5432/adunni
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  session-store:
    build:
      context: .
      dockerfile: packages/session-store/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://adunni:adunni_dev_pass@postgres:5432/adunni
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-dashboard:
    build:
      context: .
      dockerfile: packages/admin-dashboard/Dockerfile
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - API_GATEWAY_URL=http://api-gateway:3000
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pgdata:
  asr-models:
